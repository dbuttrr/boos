<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" />
    <title>Bus ETA</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="map-stage" class="map-stage" aria-hidden="false">
        <div id="focus-map" class="map-stage__map" role="img" aria-label="Map"></div>
      </div>
      <header class="header">
        <div class="header__bar">
          <p class="header__subtitle" id="last-refresh">Loading…</p>
        </div>
      </header>
      <nav class="nav-dock" aria-label="App controls">
        <button
          type="button"
          id="add-route-btn"
          class="nav-dock__add"
          aria-label="Add route"
        >
          +
        </button>
      </nav>
      <div
        class="theme-toggle"
        id="theme-toggle"
        role="group"
        aria-label="Color theme"
      >
        <button
          type="button"
          class="theme-toggle__btn theme-toggle__btn--light"
          data-theme-choice="light"
          aria-label="Light mode"
          aria-pressed="true"
        >
          <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.75" />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              d="M12 2.75v2.5M12 18.75v2.5M2.75 12h2.5M18.75 12h2.5M5.05 5.05l1.77 1.77M17.18 17.18l1.77 1.77M18.95 5.05l-1.77 1.77M6.82 17.18l-1.77 1.77"
            />
          </svg>
        </button>
        <button
          type="button"
          class="theme-toggle__btn theme-toggle__btn--dark"
          data-theme-choice="dark"
          aria-label="Dark mode"
          aria-pressed="false"
        >
          <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linejoin="round"
              d="M19.25 13.6A7.5 7.5 0 0 1 10.4 4.75 7.75 7.75 0 1 0 19.25 13.6Z"
            />
          </svg>
        </button>
      </div>
      <div class="watch-sheet">
        <section class="cards" id="cards" aria-live="polite"></section>
      </div>
      <div id="add-sheet" class="add-sheet" hidden aria-modal="true" role="dialog" aria-labelledby="add-sheet-title">
        <div class="add-sheet__panel">
          <header class="add-sheet__header">
            <h2 id="add-sheet-title" class="add-sheet__title">Add route</h2>
            <button type="button" id="add-sheet-close" class="add-sheet__close" aria-label="Close">×</button>
          </header>
          <div class="add-sheet__form">
            <label class="add-sheet__field">
              <span class="add-sheet__label">Route</span>
              <input
                type="text"
                id="add-route-input"
                class="add-sheet__input"
                inputmode="text"
                autocomplete="off"
                placeholder="e.g. 788"
                aria-autocomplete="list"
                aria-controls="add-route-suggestions"
              />
              <ul
                id="add-route-suggestions"
                class="add-sheet__suggestions"
                role="listbox"
                hidden
              ></ul>
            </label>
            <fieldset class="add-sheet__direction" id="add-direction-fieldset" disabled>
              <legend class="add-sheet__label">Direction</legend>
              <div class="add-sheet__direction-btns">
                <button type="button" class="add-sheet__dir-btn" data-direction="O" id="add-dir-outbound">
                  Outbound
                </button>
                <button type="button" class="add-sheet__dir-btn" data-direction="I" id="add-dir-inbound">
                  Inbound
                </button>
              </div>
            </fieldset>
            <p class="add-sheet__error" id="add-sheet-error" hidden></p>
          </div>
          <div id="add-map" class="add-sheet__map" role="img" aria-label="Route stops map"></div>
          <footer class="add-sheet__footer">
            <p class="add-sheet__selection" id="add-selection-label"></p>
            <div class="add-sheet__actions">
              <button type="button" id="add-cancel-btn" class="add-sheet__btn add-sheet__btn--secondary">Cancel</button>
              <button type="button" id="add-confirm-btn" class="add-sheet__btn add-sheet__btn--primary" disabled>Add</button>
            </div>
          </footer>
        </div>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
