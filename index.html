<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bus ETA" />
    <title>Bus ETA</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      /* Older iOS: display-mode media may lag; navigator.standalone is reliable. */
      (function () {
        if (window.navigator.standalone) {
          document.documentElement.classList.add("ios-standalone");
        }
      })();
    </script>
  </head>
  <body>
    <main id="app">
      <div id="map-stage" class="map-stage" aria-hidden="false">
        <div id="focus-map" class="map-stage__map" role="img" aria-label="Map"></div>
      </div>
      <p id="add-pick-hint" class="add-pick-hint" hidden role="status">
        Tap your boarding stop on the map
      </p>
      <div class="add-anchor">
        <div class="add-flow-stack">
          <ul
            id="add-route-suggestions"
            class="add-flow__suggestions"
            role="listbox"
            hidden
          ></ul>
          <div id="add-flow" class="add-flow" hidden aria-live="polite">
            <div class="add-flow__bar">
              <div class="add-flow__body">
                <div id="add-flow-step-route" class="add-flow__step">
                  <div class="add-flow__field">
                    <input
                      type="text"
                      id="add-route-input"
                      class="add-flow__input"
                      inputmode="text"
                      autocomplete="off"
                      placeholder="Enter a route e.g. 8X"
                      aria-label="Enter a route e.g. 8X"
                      aria-autocomplete="list"
                      aria-controls="add-route-suggestions"
                    />
                  </div>
                </div>
              <div id="add-flow-step-direction" class="add-flow__step" hidden>
                <p class="add-flow__summary" id="add-flow-route-summary"></p>
                <fieldset
                  class="add-flow__direction"
                  id="add-direction-fieldset"
                  aria-label="Direction"
                >
                  <div class="add-flow__direction-btns">
                    <button
                      type="button"
                      class="add-flow__dir-btn"
                      data-direction="O"
                      id="add-dir-outbound"
                    >
                      Outbound
                    </button>
                    <button
                      type="button"
                      class="add-flow__dir-btn"
                      data-direction="I"
                      id="add-dir-inbound"
                    >
                      Inbound
                    </button>
                  </div>
                </fieldset>
              </div>
            </div>
          </div>
          <p class="add-flow__error" id="add-flow-error" hidden></p>
        </div>
        </div>
        <nav class="nav-dock" aria-label="App controls">
          <button
            type="button"
            id="add-route-btn"
            class="nav-dock__add"
            aria-label="Add route"
          >
            +
          </button>
        </nav>
      </div>
      <div
        class="theme-toggle"
        id="theme-toggle"
        role="group"
        aria-label="Color theme"
      >
        <button
          type="button"
          class="theme-toggle__btn theme-toggle__btn--light"
          data-theme-choice="light"
          aria-label="Light mode"
          aria-pressed="true"
        >
          <svg
            class="theme-toggle__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="12"
              cy="12"
              r="3.75"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              d="M12 3v2.25M12 18.75V21M3 12h2.25M18.75 12H21M5.64 5.64l1.6 1.6M16.76 16.76l1.6 1.6M18.36 5.64l-1.6 1.6M7.24 16.76l-1.6 1.6"
            />
          </svg>
        </button>
        <button
          type="button"
          class="theme-toggle__btn theme-toggle__btn--dark"
          data-theme-choice="dark"
          aria-label="Dark mode"
          aria-pressed="false"
        >
          <svg
            class="theme-toggle__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linejoin="round"
              stroke-linecap="round"
              d="M14.3 3.85A8.25 8.25 0 1 0 20.15 14.3 6.6 6.6 0 0 1 14.3 3.85Z"
            />
          </svg>
        </button>
      </div>
      <div class="watch-sheet">
        <p class="watch-sheet__status">
          <span id="last-refresh">Loading…</span>
          <span class="watch-sheet__countdown" id="next-refresh" hidden></span>
        </p>
        <section class="cards" id="cards" aria-live="polite"></section>
      </div>
      <div id="add-toast" class="add-toast" hidden role="status"></div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
